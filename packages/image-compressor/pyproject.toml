[project]
name = "image-compressor"
version = "0.1.0"
dependencies = [
    "Pillow>=10.0.0",
    "opencv-python>=4.0.0",
    "numpy>=1.20.0",
    "accelerate>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_compressor"]
