[project]
name = "local-rag"
version = "0.1.0"
description = "A simple CLI tool for RAG over local markdown files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pytest>=7.0.0",
    "google-genai>=1.67.0",
]

[project.scripts]
local-rag = "local_rag:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
