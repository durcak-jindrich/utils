[project]
name = "mcp-repo-context"
version = "0.1.0"
description = "An MCP server to expose repository context (structure, commits, TODOs) to AI clients."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "gitpython>=3.1.0",
]

[project.scripts]
mcp-repo-context = "mcp_repo_context.main:main"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
