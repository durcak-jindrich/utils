[project]
name = "pr-reviewer"
version = "0.1.0"
description = "A pull request code reviewer built using CrewAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.102.0",
    "litellm",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pytest>=7.0.0",
    "langsmith>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
