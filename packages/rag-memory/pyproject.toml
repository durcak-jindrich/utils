[project]
name = "rag-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.25.0",
    "langchain>=0.3.28",
    "langchain-groq>=0.3.8",
    "langchain-pinecone>=0.2.13",
    "pandas>=2.3.3",
    "pinecone>=7.3.0",
    "pinecone-text>=0.5.1",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=3.0.1",
    "uvicorn>=0.41.0",
]

[project.scripts]
rag-memory-server = "rag_memory.main:start"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
